name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toonflow-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create source archive
        run: git archive --format=tar.gz --output=toonflow-release.tar.gz "${GITHUB_SHA}"

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          script: mkdir -p /data/apps/toonflow-app/releases

      - name: Upload source archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          source: toonflow-release.tar.gz
          target: /data/apps/toonflow-app/releases
          overwrite: true

      - name: Switch release and verify health
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -euo pipefail

            app_root=/data/apps/toonflow-app
            app_dir="$app_root/app"
            releases_dir="$app_root/releases"
            archive="$releases_dir/toonflow-release.tar.gz"
            release_dir="$releases_dir/$DEPLOY_SHA"
            previous_dir="$releases_dir/app-before-$DEPLOY_SHA"
            failed_dir="$releases_dir/app-failed-$DEPLOY_SHA"

            test -f "$archive"
            test -f "$app_dir/Dockerfile.production"

            mkdir -p "$release_dir"
            tar -xzf "$archive" -C "$release_dir"
            cp "$app_dir/Dockerfile.production" "$release_dir/Dockerfile.production"

            mv "$app_dir" "$previous_dir"
            mv "$release_dir" "$app_dir"

            rollback() {
              echo "Deployment failed; restoring the previous release."
              mv "$app_dir" "$failed_dir" || true
              mv "$previous_dir" "$app_dir" || true
              cd "$app_root"
              docker compose up -d --build || true
            }
            trap rollback ERR

            # The persistent /app/data volume shadows image data. Update the tracked
            # runtime resources while retaining files absent from the release archive.
            cp -a "$app_dir/data/." "$app_root/volumes/data/"

            cd "$app_root"
            docker compose build
            docker compose up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:10588/ > /dev/null; then
                docker compose ps
                echo "Deployment succeeded: $DEPLOY_SHA"
                exit 0
              fi
              sleep 2
            done

            echo "Deployment failed: service did not become healthy."
            exit 1
